name: contributions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/contributions.py]

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Draw the contribution graph
        run: python3 scripts/contributions.py DITlieD assets/contributions.svg
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit when the graph changed
        run: |
          if git diff --quiet -- assets/contributions.svg; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "Redraw the contribution graph"
          git push
